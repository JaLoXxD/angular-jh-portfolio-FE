<div class="contact-cta">

  <p class="contact-cta__text">{{ 'contactCta.text' | translate }}</p>

  <div class="contact-cta__actions">
    <a class="contact-cta__button contact-cta__button--primary" href="mailto:jororlando512@gmail.com">
      <app-icon name="mail" />
      {{ 'contactCta.email' | translate }}

    <a
      class="contact-cta__button"
      href="https://www.linkedin.com/in/jorgehidalgo512/"
      target="_blank"
      rel="noopener"

      {{ 'contactCta.linkedin' | translate }}

  </div>
</div>
